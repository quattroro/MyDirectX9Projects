<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #070a14;
    color: #e6e9f2;
    font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
    touch-action: none;
    cursor: none;
  }
  .help { font-size: 13px; color: #7d869c; text-align: center; padding: 0 16px; }
  .help b { color: #c3cadb; font-weight: 600; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="help">
  <b>마우스 / ← →</b> 이동 · <b>클릭 / Space</b> 발사 · <b>P</b> 일시정지 · <b>M</b> 소리 켜기/끄기
</div>

<script>
(() => {
  'use strict';

  // ───────── 기본 설정 ─────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 600;
  const TOP = 48;                 // HUD 아래 천장 위치
  const COLS = 10, GAP = 6, MARGIN = 28, BRICK_H = 22, BRICK_TOP = TOP + 30;
  const BALL_R = 7;
  const BASE_PW = 110, PADDLE_H = 14, PADDLE_Y = H - 42, PADDLE_SPEED = 720;
  const MAX_LIVES = 6;
  const ROW_HUES = [350, 18, 42, 95, 160, 195, 225, 265, 300];

  const PATTERNS = [
    () => true,
    (r, c) => (r + c) % 2 === 0 || r === 0,
    (r, c) => Math.abs(c - 4.5) < r + 1,
    (r, c) => !(c === 3 || c === 6) || r % 3 === 0,
    (r, c, R) => r === 0 || r === R - 1 || c === 0 || c === COLS - 1 || (r + c) % 3 === 0,
  ];

  const POWERUPS = {
    wide:  { label: 'W', color: '#38bdf8', text: 'WIDE PADDLE' },
    multi: { label: 'M', color: '#a78bfa', text: 'MULTI BALL' },
    slow:  { label: 'S', color: '#34d399', text: 'SLOW BALL' },
    life:  { label: '♥', color: '#f472b6', text: '+1 LIFE' },
  };

  // ───────── 상태 ─────────
  const state = { mode: 'title', score: 0, lives: 3, level: 1, hi: loadHi(), muted: false, clearTimer: 0 };
  let paddle, balls, bricks, particles = [], powerups = [], floaters = [], effects;
  const keys = { left: false, right: false };
  let pointerX = null;
  let shake = 0;

  function loadHi() { try { return +localStorage.getItem('breakout_hi') || 0; } catch (e) { return 0; } }
  function saveHi() { try { localStorage.setItem('breakout_hi', String(state.hi)); } catch (e) {} }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ballSpeed = () => (380 + (state.level - 1) * 35) * (effects && effects.slow > 0 ? 0.7 : 1);

  // ───────── 화면 크기 (HiDPI 대응) ─────────
  let scale = 1;
  function resize() {
    scale = Math.min((innerWidth - 24) / W, (innerHeight - 60) / H, 1.6);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ───────── 사운드 ─────────
  let actx = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.04) {
    if (state.muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  }

  // ───────── 게임 구성 ─────────
  function buildBricks() {
    bricks = [];
    const rows = Math.min(5 + state.level, 9);
    const pat = PATTERNS[(state.level - 1) % PATTERNS.length];
    const bw = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!pat(r, c, rows)) continue;
        let hp = 1;
        if (state.level >= 2 && r < Math.min(state.level - 1, 3)) hp = 2;
        if (state.level >= 4 && r === 0) hp = 3;
        bricks.push({
          x: MARGIN + c * (bw + GAP), y: BRICK_TOP + r * (BRICK_H + GAP),
          w: bw, h: BRICK_H, hp, maxHp: hp, hue: ROW_HUES[r % ROW_HUES.length],
          points: (rows - r) * 10, alive: true, flash: 0,
        });
      }
    }
  }

  function resetPaddle() {
    paddle = { x: W / 2 - BASE_PW / 2, y: PADDLE_Y, w: BASE_PW, h: PADDLE_H };
  }

  function resetBall() {
    balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true, offset: 0, trail: [] }];
    effects = { wide: 0, slow: 0 };
    powerups = [];
  }

  function startGame() {
    state.score = 0;
    state.lives = 3;
    state.level = 1;
    buildBricks();
    resetPaddle();
    resetBall();
    particles = []; floaters = [];
    state.mode = 'playing';
    beep(520, 0.1, 'triangle');
  }

  function nextLevel() {
    state.level++;
    buildBricks();
    resetPaddle();
    resetBall();
    state.mode = 'playing';
  }

  function launch() {
    let launched = false;
    for (const b of balls) {
      if (!b.stuck) continue;
      const ang = (Math.random() - 0.5) * 0.7;
      const s = ballSpeed();
      b.vx = s * Math.sin(ang);
      b.vy = -s * Math.cos(ang);
      b.stuck = false;
      launched = true;
    }
    if (launched) beep(660, 0.06, 'triangle');
  }

  function action() {
    if (state.mode === 'title' || state.mode === 'gameover') startGame();
    else if (state.mode === 'paused') state.mode = 'playing';
    else if (state.mode === 'playing') launch();
  }

  function togglePause() {
    if (state.mode === 'playing') state.mode = 'paused';
    else if (state.mode === 'paused') state.mode = 'playing';
  }

  // ───────── 입력 ─────────
  function toGameX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }

  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; pointerX = null; }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; pointerX = null; }
    if (e.code === 'Space' || k === 'Enter') { e.preventDefault(); action(); }
    if (k === 'p' || k === 'P' || k === 'Escape') togglePause();
    if (k === 'm' || k === 'M') state.muted = !state.muted;
  });
  addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  addEventListener('pointermove', e => { pointerX = toGameX(e); });
  canvas.addEventListener('pointerdown', e => { pointerX = toGameX(e); action(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.mode === 'playing') state.mode = 'paused';
  });

  // ───────── 효과 ─────────
  function spawnParticles(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6 + Math.random() * 0.4, max: 1, size: 2 + Math.random() * 3, color });
    }
  }

  function addFloater(x, y, text, color = '#fff') {
    floaters.push({ x, y, text, color, life: 1.1 });
  }

  function brickColor(br, light = 0) {
    const l = (br.hp >= 3 ? 34 : br.hp === 2 ? 44 : 56) + light;
    return `hsl(${br.hue}, 78%, ${l}%)`;
  }

  // ───────── 충돌 / 점수 ─────────
  function hitBrick(br) {
    br.hp--;
    br.flash = 0.12;
    if (br.hp <= 0) {
      br.alive = false;
      state.score += br.points;
      spawnParticles(br.x + br.w / 2, br.y + br.h / 2, `hsl(${br.hue}, 85%, 60%)`);
      beep(300 + Math.random() * 300, 0.07, 'square');
      shake = Math.max(shake, 3);
      if (Math.random() < 0.13) {
        const r = Math.random();
        const type = r < 0.1 ? 'life' : r < 0.4 ? 'wide' : r < 0.7 ? 'multi' : 'slow';
        powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type });
      }
    } else {
      state.score += 5;
      beep(180, 0.06, 'sawtooth', 0.03);
    }
    if (state.score > state.hi) state.hi = state.score;
  }

  function applyPowerup(p) {
    const info = POWERUPS[p.type];
    addFloater(p.x, paddle.y - 20, info.text, info.color);
    beep(880, 0.12, 'triangle', 0.05);
    setTimeout(() => beep(1175, 0.12, 'triangle', 0.05), 80);
    state.score += 50;
    if (state.score > state.hi) state.hi = state.score;

    if (p.type === 'wide') effects.wide = 12;
    else if (p.type === 'slow') effects.slow = 10;
    else if (p.type === 'life') state.lives = Math.min(state.lives + 1, MAX_LIVES);
    else if (p.type === 'multi') {
      const src = balls.find(b => !b.stuck) || balls[0];
      if (!src) return;
      const base = src.stuck ? -Math.PI / 2 : Math.atan2(src.vy, src.vx);
      const s = ballSpeed();
      for (const d of [-0.5, 0.5]) {
        const a = base + d;
        balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, stuck: false, offset: 0, trail: [] });
      }
    }
  }

  function loseLife() {
    state.lives--;
    shake = 10;
    beep(150, 0.35, 'sawtooth', 0.06);
    if (state.lives <= 0) {
      state.mode = 'gameover';
      saveHi();
    } else {
      resetBall();
    }
  }

  // ───────── 업데이트 ─────────
  function update(dt) {
    if (state.mode === 'paused') return;

    // 파티클 / 플로터는 다른 화면에서도 움직임
    for (const p of particles) {
      p.life -= dt;
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.life -= dt; f.y -= 40 * dt; }
    floaters = floaters.filter(f => f.life > 0);
    shake = Math.max(0, shake - dt * 30);

    if (state.mode === 'clear') {
      state.clearTimer -= dt;
      if (state.clearTimer <= 0) nextLevel();
      return;
    }
    if (state.mode !== 'playing') return;

    // 효과 타이머
    effects.wide = Math.max(0, effects.wide - dt);
    effects.slow = Math.max(0, effects.slow - dt);

    // 패들
    const cx = paddle.x + paddle.w / 2;
    const targetW = effects.wide > 0 ? BASE_PW * 1.6 : BASE_PW;
    paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);
    paddle.x = cx - paddle.w / 2;
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (pointerX !== null && !keys.left && !keys.right) paddle.x = pointerX - paddle.w / 2;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    // 공
    const speed = ballSpeed();
    for (const b of balls) {
      if (b.stuck) {
        b.x = paddle.x + paddle.w / 2 + b.offset;
        b.y = paddle.y - BALL_R - 1;
        b.trail.length = 0;
        continue;
      }
      // 속도 정규화 + 너무 수평으로 흐르지 않게
      let v = Math.hypot(b.vx, b.vy) || 1;
      b.vx *= speed / v; b.vy *= speed / v;
      if (Math.abs(b.vy) < speed * 0.3) {
        b.vy = Math.sign(b.vy || -1) * speed * 0.3;
        b.vx = Math.sign(b.vx || 1) * Math.sqrt(speed * speed - b.vy * b.vy);
      }

      const steps = Math.ceil((speed * dt) / (BALL_R * 0.5));
      const sdt = dt / steps;
      for (let i = 0; i < steps && !b.dead; i++) {
        b.x += b.vx * sdt;
        b.y += b.vy * sdt;

        // 벽
        if (b.x - BALL_R < 0) { b.x = BALL_R; b.vx = Math.abs(b.vx); beep(420, 0.03, 'triangle', 0.02); }
        if (b.x + BALL_R > W) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); beep(420, 0.03, 'triangle', 0.02); }
        if (b.y - BALL_R < TOP) { b.y = TOP + BALL_R; b.vy = Math.abs(b.vy); beep(420, 0.03, 'triangle', 0.02); }
        if (b.y - BALL_R > H) { b.dead = true; break; }

        // 패들
        if (b.vy > 0 && b.y + BALL_R >= paddle.y && b.y - BALL_R <= paddle.y + paddle.h &&
            b.x >= paddle.x - BALL_R && b.x <= paddle.x + paddle.w + BALL_R) {
          const hit = clamp((b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
          const ang = hit * (Math.PI / 3);
          b.vx = speed * Math.sin(ang);
          b.vy = -speed * Math.cos(ang);
          b.y = paddle.y - BALL_R;
          beep(240, 0.05, 'square', 0.035);
        }

        // 벽돌
        for (const br of bricks) {
          if (!br.alive) continue;
          const nx = clamp(b.x, br.x, br.x + br.w), ny = clamp(b.y, br.y, br.y + br.h);
          const dx = b.x - nx, dy = b.y - ny;
          if (dx * dx + dy * dy <= BALL_R * BALL_R) {
            const ox = Math.min(b.x + BALL_R - br.x, br.x + br.w - (b.x - BALL_R));
            const oy = Math.min(b.y + BALL_R - br.y, br.y + br.h - (b.y - BALL_R));
            if (ox < oy) b.vx = b.x < br.x + br.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
            else         b.vy = b.y < br.y + br.h / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);
            hitBrick(br);
            break;
          }
        }
      }
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 10) b.trail.shift();
    }
    balls = balls.filter(b => !b.dead);
    if (balls.length === 0) { loseLife(); return; }

    // 벽돌 깜빡임
    for (const br of bricks) if (br.flash > 0) br.flash -= dt;

    // 파워업 낙하
    for (const p of powerups) {
      p.y += 160 * dt;
      if (p.y + 10 >= paddle.y && p.y - 10 <= paddle.y + paddle.h && p.x >= paddle.x - 12 && p.x <= paddle.x + paddle.w + 12) {
        p.taken = true;
        applyPowerup(p);
      }
    }
    powerups = powerups.filter(p => !p.taken && p.y < H + 20);

    // 레벨 클리어
    if (bricks.every(br => !br.alive)) {
      state.mode = 'clear';
      state.clearTimer = 2;
      state.score += 100 * state.level;
      if (state.score > state.hi) state.hi = state.score;
      saveHi();
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.05), i * 110));
    }
  }

  // ───────── 그리기 ─────────
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#131a2e');
  bgGrad.addColorStop(1, '#090c18');

  function drawBackground() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = TOP; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, 0, W, TOP);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(0, TOP - 1, W, 1);

    ctx.textBaseline = 'middle';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = '#7d869c';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE', 20, TOP / 2);
    ctx.fillText('LEVEL', 210, TOP / 2);
    ctx.fillText('BEST', 330, TOP / 2);
    ctx.font = '700 20px system-ui, sans-serif';
    ctx.fillStyle = '#f1f4fb';
    ctx.fillText(String(state.score).padStart(6, '0'), 72, TOP / 2 + 1);
    ctx.fillText(state.level, 260, TOP / 2 + 1);
    ctx.fillText(String(state.hi).padStart(6, '0'), 372, TOP / 2 + 1);

    // 효과 표시
    let ex = 500;
    ctx.font = '700 11px system-ui, sans-serif';
    for (const [k, t] of [['wide', effects && effects.wide], ['slow', effects && effects.slow]]) {
      if (!t) continue;
      const info = POWERUPS[k];
      ctx.fillStyle = info.color;
      ctx.globalAlpha = t < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(t * 8)) : 1;
      rr(ex, TOP / 2 - 10, 46, 20, 10); ctx.fill();
      ctx.fillStyle = '#0b1020';
      ctx.textAlign = 'center';
      ctx.fillText(`${info.label} ${Math.ceil(t)}s`, ex + 23, TOP / 2 + 1);
      ctx.globalAlpha = 1;
      ex += 54;
    }

    // 목숨
    for (let i = 0; i < state.lives; i++) {
      const x = W - 24 - i * 22;
      ctx.beginPath();
      ctx.arc(x, TOP / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#f472b6';
      ctx.fill();
    }
    if (state.muted) {
      ctx.textAlign = 'right';
      ctx.font = '600 11px system-ui, sans-serif';
      ctx.fillStyle = '#7d869c';
      ctx.fillText('MUTED', W - 24 - state.lives * 22 - 4, TOP / 2);
    }
  }

  function drawBricks() {
    for (const br of bricks) {
      if (!br.alive) continue;
      const g = ctx.createLinearGradient(0, br.y, 0, br.y + br.h);
      g.addColorStop(0, brickColor(br, 10));
      g.addColorStop(1, brickColor(br, -8));
      ctx.fillStyle = br.flash > 0 ? '#ffffff' : g;
      rr(br.x, br.y, br.w, br.h, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      rr(br.x + 3, br.y + 2, br.w - 6, 4, 2);
      ctx.fill();
      if (br.maxHp > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.5;
        rr(br.x + 0.75, br.y + 0.75, br.w - 1.5, br.h - 1.5, 5);
        ctx.stroke();
        // 남은 내구도 점
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        for (let i = 0; i < br.hp; i++) {
          ctx.beginPath();
          ctx.arc(br.x + br.w / 2 + (i - (br.hp - 1) / 2) * 8, br.y + br.h / 2 + 2, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    const wide = effects && effects.wide > 0;
    g.addColorStop(0, wide ? '#7dd3fc' : '#e2e8f0');
    g.addColorStop(1, wide ? '#0284c7' : '#64748b');
    ctx.shadowColor = wide ? 'rgba(56,189,248,0.7)' : 'rgba(148,163,184,0.5)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = g;
    rr(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBalls() {
    const slow = effects && effects.slow > 0;
    for (const b of balls) {
      b.trail.forEach((t, i) => {
        ctx.globalAlpha = (i / b.trail.length) * 0.35;
        ctx.beginPath();
        ctx.arc(t.x, t.y, BALL_R * (0.4 + 0.6 * i / b.trail.length), 0, Math.PI * 2);
        ctx.fillStyle = slow ? '#34d399' : '#fde68a';
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowColor = slow ? 'rgba(52,211,153,0.9)' : 'rgba(253,230,138,0.9)';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPowerups() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 13px system-ui, sans-serif';
    for (const p of powerups) {
      const info = POWERUPS[p.type];
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = info.color;
      rr(p.x - 18, p.y - 10, 36, 20, 10);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0b1020';
      ctx.fillText(info.label, p.x, p.y + 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.font = '800 15px system-ui, sans-serif';
    for (const f of floaters) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, sub, sub2) {
    ctx.fillStyle = 'rgba(7,10,20,0.72)';
    ctx.fillRect(0, TOP, W, H - TOP);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 56px system-ui, sans-serif';
    const g = ctx.createLinearGradient(W / 2 - 200, 0, W / 2 + 200, 0);
    g.addColorStop(0, '#f472b6');
    g.addColorStop(0.5, '#fde68a');
    g.addColorStop(1, '#38bdf8');
    ctx.fillStyle = g;
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = '500 18px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#c3cadb';
    if (sub) ctx.fillText(sub, W / 2, H / 2 + 28);
    if (sub2) {
      ctx.font = '500 14px system-ui, "Malgun Gothic", sans-serif';
      ctx.fillStyle = '#7d869c';
      ctx.fillText(sub2, W / 2, H / 2 + 60);
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    drawBricks();
    drawPowerups();
    drawPaddle();
    if (state.mode !== 'title') drawBalls();
    drawParticles();
    ctx.restore();
    drawHUD();

    const blink = Math.floor(performance.now() / 500) % 2 === 0;
    if (state.mode === 'title') {
      overlay('BREAKOUT', blink ? '클릭 또는 Space 키로 시작' : '', '벽돌을 모두 깨고 다음 레벨로 넘어가세요');
    } else if (state.mode === 'paused') {
      overlay('PAUSED', 'P 키 또는 클릭으로 계속하기');
    } else if (state.mode === 'gameover') {
      overlay('GAME OVER', `점수 ${state.score}  ·  최고 ${state.hi}`, blink ? '클릭 또는 Space 키로 다시 시작' : '');
    } else if (state.mode === 'clear') {
      overlay(`LEVEL ${state.level} CLEAR!`, `보너스 +${100 * state.level}`);
    } else if (state.mode === 'playing' && balls.some(b => b.stuck)) {
      ctx.textAlign = 'center';
      ctx.font = '500 15px system-ui, "Malgun Gothic", sans-serif';
      ctx.fillStyle = blink ? '#c3cadb' : '#7d869c';
      ctx.fillText('클릭 또는 Space 키로 공 발사', W / 2, H / 2 + 80);
    }
  }

  // ───────── 루프 ─────────
  buildBricks();
  resetPaddle();
  resetBall();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
